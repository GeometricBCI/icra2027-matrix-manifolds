<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" fill="none">
  <title>The circle of planar rotations</title>
  <desc>A hand-drawn circle represents SO(2), with a radial guide and a counterclockwise rotation arrow. The circle's interior is not part of the manifold.</desc>
  <defs>
    <filter id="rotation-paper" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#rotation-paper)">
    <path d="M130 75C130.4 101.7 108.8 124.6 80.8 124C53.1 124.7 29.4 102.8 30 75.1C29.6 47.3 51.7 25.4 79.7 25C108.3 24.3 130.6 47.7 130 75Z" stroke="#e4c29f" stroke-width="8" opacity=".62"/>
    <path d="M130 75C130.4 101.7 108.8 124.6 80.8 124C53.1 124.7 29.4 102.8 30 75.1C29.6 47.3 51.7 25.4 79.7 25C108.3 24.3 130.6 47.7 130 75Z" stroke="#786b52" stroke-width="1.8"/>
    <path d="M31.8 91.4C41.3 116.8 68.4 131 94 122.4M47.7 36.4C62.3 23.3 82.7 21.4 98.3 28.7" stroke="#9a8465" stroke-width=".8" opacity=".46"/>
    <path d="M80 75H129.5" stroke="#a99d83" stroke-width="1.2" stroke-dasharray="3 4"/>
    <path d="M80 75L112.2 36.7" stroke="#877b62" stroke-width="1.5"/>
    <path d="M98 75C98 69.5 95.5 64.1 91.6 61.2" stroke="#b47b57" stroke-width="1.25"/>
    <circle cx="80" cy="75" r="2.4" fill="#786b52"/>
    <circle cx="112.2" cy="36.7" r="3.8" fill="#b76b4d" stroke="#f5e5d2" stroke-width="1.2"/>
    <path d="M138.6 72.1C138.2 57.3 132.2 44 121.3 33.5" stroke="#a86648" stroke-width="1.8"/>
    <path d="M129.6 35.2L120.3 32.4L122.3 41.4" stroke="#a86648" stroke-width="1.8"/>
    <path d="M16.7 55.4L21.2 57.1M21.7 47.1L24.8 50.1" stroke="#b7ae91" stroke-width="1.2"/>
    <path d="M135.4 109.7L136.4 112.4L139.2 113.3L136.5 114.3L135.6 117.1L134.6 114.4L131.8 113.5L134.5 112.5Z" fill="#e2c784" stroke="#b4a06d" stroke-width=".8"/>
  </g>
</svg>
